name: Makaleleri arşivle

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"   # her ayın 1'i 06:00 (TSİ)

permissions:
  contents: write

jobs:
  arsivle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Önbelleği geri yükle
        uses: actions/cache@v4
        with:
          path: .onbellek
          key: onbellek-${{ github.run_id }}
          restore-keys: onbellek-
      - run: python scraper.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "arsiv-bot"
          git config user.email "arsiv-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Arşiv güncellemesi $(date -u +%F)"
          git push
